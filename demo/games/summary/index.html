<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f0">
  <meta name="description" content="官方三輪試玩成績卡：單字 90 秒、詞組 120 秒、篇章（示範幽靈陪跑）計時三輪成績一頁睇。CanCLID 粵拼打字比賽。">
  <title>三輪成績卡 · CanCLID</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --paper: #f7f6f0;
      --white: #fffefa;
      --ink: #233b32;
      --muted: #5f6b62;
      --line: #dedfd3;
      --orange: #c54724;
      --green: #227453;
      --sans: "Helvetica Neue", Arial, "PingFang HK", "Noto Sans CJK TC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
    [hidden] { display: none !important; }
    h1 { font-size: 32px; line-height: 1.3; margin: 0 0 8px; }
    h2 { font-size: 22px; line-height: 1.4; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .sr-only, .skip-link { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    .skip-link { top: -80px; left: 16px; z-index: 10; width: auto; height: auto; clip: none; padding: 10px 20px; border-radius: 5px; background: var(--ink); color: #fff; }
    .skip-link:focus { top: 10px; }

    .site-shell { max-width: 1000px; padding: 0 32px 48px; margin: auto; }
    .site-header { min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark { position: relative; display: grid; place-items: center; background: var(--orange); color: var(--white); width: 44px; height: 44px; font-size: 28px; font-weight: 700; border-radius: 10px 10px 10px 2px; }
    .brand-mark > span { position: absolute; right: -5px; top: -7px; background: var(--paper); color: var(--orange); font-size: 22px; width: 20px; height: 22px; line-height: 22px; }
    .brand-type { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .nav { display: flex; gap: 28px; }
    .nav-link { padding: 16px 0; color: var(--muted); font-size: 16px; text-decoration: none; }
    .nav-link:hover { color: var(--ink); text-decoration: underline; }
    .demo-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; border: 1px solid var(--line); border-radius: 24px; padding: 4px 12px; white-space: nowrap; }
    .demo-badge > span { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

    .hero { padding: 32px 0 24px; }
    .hero p { margin: 0; color: var(--muted); }
    .card { margin-bottom: 20px; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
    .player-line { color: var(--muted); font-size: 15px; }
    .round-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 16px; }
    .round-table caption { text-align: left; }
    .round-table th, .round-table td { padding: 14px 12px; border-top: 1px solid #e9ecdf; font-variant-numeric: tabular-nums; }
    .round-table thead th { border-top: 0; background: #f1f3e9; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
    .round-table tbody th { font-weight: 600; }
    .round-table td:not(:first-child), .round-table th:not(:first-child) { text-align: right; }
    .round-table tr.missing td, .round-table tr.missing th { color: var(--muted); }
    .round-score { font-weight: 700; font-size: 18px; }
    .round-threshold { white-space: nowrap; }
    .totals-line { margin: 16px 0 0; color: var(--muted); font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border: 1px solid var(--orange); border-radius: 7px; background: var(--orange); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; }
    .button:hover { background: #ac3a1c; }
    .button.ghost { border-color: var(--ink); background: transparent; color: var(--ink); }
    .button.ghost:hover { background: #e9eddf; }
    .note { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    .history-list { margin: 0; padding: 0; list-style: none; }
    .history-list li { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-top: 1px solid #e9ecdf; font-size: 15px; }
    .history-list li:first-child { border-top: 0; }
    .history-when { color: var(--muted); font-variant-numeric: tabular-nums; }
    .history-scores { font-weight: 600; }
    .history-flag { color: var(--muted); font-size: 14px; white-space: nowrap; }

    @media (max-width: 600px) {
      .site-shell { padding: 0 20px 40px; }
      .site-header { min-height: 76px; gap: 12px; }
      .brand-type, .demo-badge { display: none; }
      .round-table th, .round-table td { padding: 10px 6px; font-size: 14px; }
      .history-list li { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
  <script src="./summary-dom.mjs" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳去主要內容</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="../../index.html" aria-label="粵拼競速首頁">
        <span class="brand-mark" aria-hidden="true">拼<span>↗</span></span>
        <span class="brand-type">粵拼競速</span>
      </a>
      <nav class="nav" aria-label="遊戲導覽">
        <a class="nav-link" href="../../index.html">‹ 試玩賽場</a>
      </nav>
      <span class="demo-badge"><span></span>三輪成績卡</span>
    </header>

    <main id="main">
      <div class="hero">
        <h1>官方三輪試玩 · 成績卡</h1>
        <p>單字 90 秒 → 詞組 120 秒 → 篇章（示範幽靈陪跑）計時，三輪成績一次過睇。</p>
      </div>

      <section id="empty-card" class="card" hidden>
        <h2>未有流程資料</h2>
        <p>直接開成績卡係唔會有數據嘅。要先由試玩賽場開始「官方三輪試玩」，順住三輪打完，先會喺呢度見到成績。</p>
        <div class="actions">
          <a id="start-flow" class="button" href="../rocks/?flow=1">開始流程 ↗</a>
          <a class="button ghost" href="../../index.html">返回試玩賽場</a>
        </div>
      </section>

      <section id="summary-card" class="card" hidden>
        <p id="player-line" class="player-line"></p>
        <table class="round-table">
          <caption class="sr-only">官方三輪試玩成績</caption>
          <thead>
            <tr>
              <th scope="col">輪次</th>
              <th scope="col">計分窗／用時</th>
              <th scope="col">正確／已交</th>
              <th scope="col">準確度</th>
              <th scope="col">正式分</th>
              <th scope="col">門檻</th>
            </tr>
          </thead>
          <tbody id="round-rows"></tbody>
        </table>
        <p id="totals-line" class="totals-line"></p>
        <div class="actions">
          <a id="again" class="button" href="../rocks/?flow=1">再玩一次流程 ↗</a>
          <a id="back" class="button ghost" href="../../index.html">返回試玩賽場</a>
        </div>
        <p id="summary-note" class="note"></p>
      </section>

      <section id="history-card" class="card" hidden>
        <h2>最近流程</h2>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
